services:
  _defaults:
    autowire: true
    autoconfigure: true

  Amir\MapParcel\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  Amir\MapParcel\Domain\ParcelaRepository:
    alias: Amir\MapParcel\Infrastructure\Cache\CachedParcelaRepository

  Amir\MapParcel\Infrastructure\Cache\CachedParcelaRepository:
    arguments:
      $inner: '@Amir\MapParcel\Infrastructure\Cuzk\CuzkParcelaRepository'